name: Unpack project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o ufabist-schedule-cloudflare-fixed.zip -d extracted
          find extracted -type f

      - name: Commit extracted files
        run: |
          cp -R extracted/. .
          rm -rf extracted
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract project ZIP" || echo "Nothing to commit"
          git push
